name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Ícono y pantalla de inicio (Comida Fast)
        run: |
          cp -r android-res/. android/app/src/main/res/
          sed -i 's|<item name="android:background">@drawable/splash</item>|&<item name="windowSplashScreenBackground">@color/ic_launcher_background</item>|' android/app/src/main/res/values/styles.xml
          grep -n "windowSplashScreenBackground" android/app/src/main/res/values/styles.xml
          ls -la android/app/src/main/res/mipmap-xxxhdpi
      - name: Copiar la web
        run: npx cap sync android
      - name: Firma fija (permite actualizar sin perder datos)
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: comida-fast-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
